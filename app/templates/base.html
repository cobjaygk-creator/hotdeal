<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}핫딜 · 패밀리세일{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}커뮤니티 핫딜을 모아 가격 기준으로 정리하는 실시간 핫딜모음{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ site_url }}{{ request.url.path }}{% endblock %}">
  <meta property="og:site_name" content="핫딜모음">
  <meta property="og:locale" content="ko_KR">
  {% block extra_head %}{% endblock %}
  <script type="application/ld+json">{{ website_jsonld | tojson }}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/components.css">
  <link rel="stylesheet" href="/static/pages.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  {% set current_nav = nav|default("hotdeal") %}
  <header class="top">
    <a class="brand" href="/">
      <span class="brand-mark">H</span>
      핫딜모음
      <span class="brand-sub">실시간 · 가격판정</span>
    </a>
    <nav class="site-nav">
      <a href="/" class="{% if current_nav == 'hotdeal' %}on{% endif %}">핫딜</a>
      <a href="/family" class="{% if current_nav == 'family' %}on{% endif %}">패밀리세일</a>
      <a href="/alerts" class="{% if current_nav == 'alerts' %}on{% endif %}">알림</a>
    </nav>
    <form class="site-search" method="get" action="/search" role="search">
      <input type="search" name="q" value="{{ q|default('') }}" placeholder="상품·판매처 검색" aria-label="검색">
    </form>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">◐</button>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        var cur = root.getAttribute("data-theme");
        var next;
        if (cur === "dark") next = "light";
        else if (cur === "light") next = "dark";
        else next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
