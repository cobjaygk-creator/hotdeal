<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}핫딜 · 패밀리세일{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% set current_nav = nav|default("hotdeal") %}
  <header class="top">
    <a class="brand" href="/">자동 핫딜 탐지기</a>
    <nav class="site-nav">
      <a href="/" class="{% if current_nav == 'hotdeal' %}on{% endif %}">핫딜</a>
      <a href="/family" class="{% if current_nav == 'family' %}on{% endif %}">패밀리세일</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
