<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}핫딜 · 패밀리세일{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}커뮤니티 핫딜을 모아 가격 기준으로 정리하는 실시간 핫딜모음{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ site_url }}{{ request.url.path }}{% endblock %}">
  <meta property="og:site_name" content="핫딜모음">
  <meta property="og:locale" content="ko_KR">
  {% block extra_head %}{% endblock %}
  <script type="application/ld+json">{{ website_jsonld | tojson }}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/components.css">
  <link rel="stylesheet" href="/static/pages.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  {% set current_nav = nav|default("hotdeal") %}
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="메뉴">
      <a class="sidebar-brand" href="/">
        <span class="brand-mark">H</span>
        핫딜모음
      </a>
      <div class="sidebar-label">메뉴</div>
      <nav class="sidebar-nav">
        <a href="/" class="{% if current_nav == 'hotdeal' %}on{% endif %}"><span class="nav-ico">⚡</span> 핫딜</a>
        <a href="/family" class="{% if current_nav == 'family' %}on{% endif %}"><span class="nav-ico">📅</span> 패밀리세일</a>
        <a href="/search" class="{% if current_nav == 'search' %}on{% endif %}"><span class="nav-ico">⌕</span> 검색</a>
        <a href="/alerts" class="{% if current_nav == 'alerts' %}on{% endif %}"><span class="nav-ico">🔔</span> 알림</a>
        <a href="/family/admin" class="{% if current_nav == 'admin' %}on{% endif %}"><span class="nav-ico">＋</span> 세일 등록</a>
      </nav>
      <div class="sidebar-foot">
        <div class="account">
          {% if user %}
          <a href="/alerts" class="account-name">{{ user.display_name }}</a>
          <a href="/logout">로그아웃</a>
          {% else %}
          <a href="/login">로그인</a>
          {% endif %}
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">◐</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="mobile-top">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="메뉴 열기">☰</button>
        <a class="mobile-brand" href="/">핫딜모음</a>
        <a class="icon-btn" href="/search" aria-label="검색">⌕</a>
      </header>
      <div class="main-inner">
        {% block body %}{% endblock %}
      </div>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (btn) {
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var cur = root.getAttribute("data-theme");
          var next;
          if (cur === "dark") next = "light";
          else if (cur === "light") next = "dark";
          else next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      }
      var sidebar = document.getElementById("sidebar");
      var backdrop = document.getElementById("sidebar-backdrop");
      var menuBtn = document.getElementById("menu-btn");
      function closeNav() {
        if (!sidebar) return;
        sidebar.classList.remove("open");
        if (backdrop) {
          backdrop.classList.remove("show");
          backdrop.hidden = true;
        }
      }
      function openNav() {
        if (!sidebar) return;
        sidebar.classList.add("open");
        if (backdrop) {
          backdrop.hidden = false;
          backdrop.classList.add("show");
        }
      }
      if (menuBtn) menuBtn.addEventListener("click", openNav);
      if (backdrop) backdrop.addEventListener("click", closeNav);
      if (sidebar) {
        sidebar.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", closeNav);
        });
      }
    })();
  </script>
</body>
</html>
