<div id="deal-modal" class="dm" role="presentation" hidden>
  <div class="dm-dim" data-close></div>
  <div class="dm-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="dm-head">
      <nav class="dm-crumb" aria-label="위치"><span>핫딜</span><span aria-hidden="true">›</span><b data-dm-cat>상세</b></nav>
      <div class="dm-tools">
        <button type="button" class="dm-icon" data-dm-prev aria-label="이전 딜">‹</button>
        <button type="button" class="dm-icon" data-dm-next aria-label="다음 딜">›</button>
        <span class="dm-vsep" aria-hidden="true"></span>
        <button type="button" class="dm-icon" data-dm-copy aria-label="링크 복사">↗</button>
        <button type="button" class="dm-icon is-close" data-close aria-label="닫기">×</button>
      </div>
    </header>
    <div class="dm-scroll" data-dm-scroll>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<div id="dm-chat-source" hidden>{% include "_deal_chat.html" %}</div>
