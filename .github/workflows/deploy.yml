name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to OCI
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: 129.225.138.202
          OCI_USER: ubuntu
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H $OCI_HOST >> ~/.ssh/known_hosts

          # 코드 전송
          git archive HEAD | ssh -i ~/.ssh/oci_key $OCI_USER@$OCI_HOST \
            "mkdir -p /home/ubuntu/hotdeal && tar -xf - -C /home/ubuntu/hotdeal"

          # 이미지 재빌드 & 컨테이너 재시작
          ssh -i ~/.ssh/oci_key $OCI_USER@$OCI_HOST \
            "cd /home/ubuntu/hotdeal && \
             sudo docker build --cache-from hotdeal:latest -t hotdeal:latest . && \
             sudo docker rm -f hotdeal 2>/dev/null || true && \
             sudo docker run -d \
               --name hotdeal \
               --restart unless-stopped \
               -p 8000:8000 \
               --env-file /home/ubuntu/hotdeal/.env \
               -v /home/ubuntu/hotdeal/data:/home/ubuntu/hotdeal/data \
               hotdeal:latest && \
             sudo docker image prune -f"
