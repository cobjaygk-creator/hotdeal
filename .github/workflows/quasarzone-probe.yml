name: Quasarzone runner probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/quasarzone-probe.yml
      - scripts/probe_quasarzone_actions.py
permissions:
  contents: read
concurrency:
  group: quasarzone-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'httpx[socks]==0.28.1' 'curl_cffi==0.16.3' 'selectolax==0.3.29' 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - name: HTTP probe
        continue-on-error: true
        run: python -m scripts.probe_quasarzone_actions
      - name: Browser probe
        run: python -m scripts.probe_quasarzone_actions --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quasarzone-probe
          path: |
            quasarzone-probe.json
            quasarzone-browser-probe.json
            quasarzone-browser-list.png
          retention-days: 7
