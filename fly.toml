app = "hotdeal"
primary_region = "nrt"  # 도쿄

[build]

[env]
  PORT = "8000"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "hotdeal_data"
  destination = "/data"
